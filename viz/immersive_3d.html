        "interpretation": "53.4% of observed sites show no inter-period change on Sentinel-2. This is a CONFOUNDED proxy, NOT proof of un-built capacity: 'no change' includes sites that are already built/operational (nothing left to change) as well as never-started ones, and carries cloud/seasonal noise. Read as a flag to pair with the construction-status proxy and permit/queue evidence -- it does not by itself meet a >50%-un-built tipping line, so it is reported as magnitude, not a satisfied condition."
      },
      {
        "question": "Is the leveraged tail large enough to be a SYSTEMIC (vs contained) risk?",
        "dimension": "leveraged_tail_size",
        "measured": "4.3% of 649 classified AI-infra entities are financed_ai_infra_leveraged",
        "first_principles_condition": null,
        "condition_met": null,
        "source_status": "source_backed",
        "interpretation": "No principled cutoff for 'systemic'. The magnitude: the leveraged tail is a SMALL share of the classified AI-infra universe, and the broad debt metric is dominated by non-AI debt -- so the loss is CONTAINED to a small, specific cluster rather than an ecosystem-wide tail. This contradicts the framework's pessimistic guess and reinforces the scoped (not ecosystem-wide) verdict."
      }
    ]
  },
  "refi_wall": {
    "by_year": {
      "y2025": 0.0,
      "y2026": 6665769000.0,
      "y2027": 7725070000.0,
      "y2028": 4739899000.0,
      "y2029": 5300834000.0,
      "y2030": 10296438000.0,
      "y2031": 4869199000.0,
      "y2032": 3993400000.0,
      "y2033": 1150000000.0,
      "y2034_plus": 5542401000.0
    },
    "peak_year": "2030",
    "near_term_window": "2025-Q3..2027-Q3 (engine peak ~2026-Q2)"
  },
  "chokepoints": {
    "power": [
      "Amazon Energy",
      "Microsoft Energy",
      "Shell Energy"
    ],
    "financing": [
      "CoreWeave"
    ]
  },
  "legend": {
    "node_types": {
      "issuer": "financed AI-compute issuer (the cluster)",
      "supplier_investor": "NVIDIA -- supplier AND equity investor (circular)",
      "fragile_offtaker": "capital-markets-dependent demand (OpenAI)",
      "durable_offtaker": "hyperscaler demand (durable FCF)",
      "lender": "lender / agent / trustee",
      "end_holder": "ultimate downside bearer (insurer/pension/household)",
      "energy_chokepoint": "power-procurement intermediary (GDS structural chokepoint)"
    },
    "fragility": "node color: green(safe)->red(fragile); size: exposure/committed debt",
    "edge_tiers": {
      "filing_verified": "solid",
      "press_reported": "dashed (NOT binding)",
      "source_backed": "solid (aggregate)"
    }
  }
};

function frgColor(f){ f=Math.max(0,Math.min(1,f||0));
  const a=[63,185,80], b=[210,153,34], c=[248,81,73];
  const lo = f<0.5 ? a : b, hi = f<0.5 ? b : c, t = f<0.5 ? f/0.5 : (f-0.5)/0.5;
  return 'rgb('+lo.map((x,i)=>Math.round(x+(hi[i]-x)*t)).join(',')+')'; }

const nodes = DATA.nodes.map(n => ({ id:n.id, label:n.label||n.id, type:n.type, frg:n.fragility||0,
  usd:n.usd||0, note:(n.note||'').split(/[.;]/)[0].trim(), col:frgColor(n.fragility) }));
const links = DATA.edges.map(e => ({ source:e.from, target:e.to, type:e.type, usd:e.usd,
  tier:e.tier, press:(e.tier==='press_reported') }));

const casc = new Set([DATA.cascade.trigger]);
(DATA.cascade.hops||[]).forEach(h => (h.nodes||[]).forEach(n => casc.add(n)));
const lid = l => (l.source && l.source.id) ? l.source.id : l.source;
const ltd = l => (l.target && l.target.id) ? l.target.id : l.target;
const isCasc = l => casc.has(lid(l)) && casc.has(ltd(l));

const G = ForceGraph3D()(document.getElementById('g'))
  .backgroundColor('#05070c')
  .graphData({ nodes, links })
  .nodeLabel(n => n.label)
  .nodeColor(n => n.col)
  .nodeVal(n => Math.max(1.2, Math.sqrt((n.usd||0)/1e9)*1.7))
  .nodeOpacity(0.95)
  .linkColor(l => l.press ? '#6e3b3b' : '#33425a')
  .linkWidth(l => l.press ? 0.3 : 0.6)
  .linkDirectionalParticles(0)
  .linkDirectionalParticleWidth(2.2)
  .onNodeClick(n => { showCard(n); const d=1.35;
     G.cameraPosition({ x:n.x*d, y:n.y*d, z:n.z*d }, n, 800); })
  .onBackgroundClick(() => { document.getElementById('card').style.display='none'; });
G.d3Force('charge').strength(-140);

const card = document.getElementById('card');
function showCard(n){
  card.innerHTML = '<div class="nm" style="color:'+n.col+'">'+n.label+'</div>'+
    '<div class="ty">'+(DATA.legend.node_types[n.type]||n.type)+'</div>'+
    '<div class="nt">'+(n.note||'')+'</div>'+
    (n.usd?'<div class="usd">$'+(n.usd/1e9).toFixed(1)+'B</div>':'');
  card.style.display='block';
}

const ccline = document.getElementById('ccline');
const dbn = (DATA.meta.cascade_debt_at_risk_usd||0)/1e9;
let on = false;
document.getElementById('play').onclick = () => {
  on = !on;
  if(on){
    G.linkDirectionalParticles(l => isCasc(l) ? 4 : 0).linkDirectionalParticleSpeed(0.012)
     .linkColor(l => isCasc(l) ? '#f0883e' : (l.press?'#6e3b3b':'#1f2a3a'))
     .linkWidth(l => isCasc(l) ? 1.4 : (l.press?0.3:0.5));
    ccline.style.opacity = 1;
    ccline.innerHTML = 'OpenAI → CoreWeave → lenders → households · <b>$'+dbn.toFixed(1)+'B at risk</b> (gross upper bound)';
  } else {
    G.linkDirectionalParticles(0).linkColor(l=>l.press?'#6e3b3b':'#33425a').linkWidth(l=>l.press?0.3:0.6);
    ccline.style.opacity = 0;
  }
};

const m = DATA.meta;
document.getElementById('c1').textContent = m.core_confidence;
document.getElementById('c2').textContent = m.ecosystem_confidence;
const panel = document.getElementById('panel');
panel.innerHTML = '<h4>Forensic honesty · red-teamed</h4><ul style="margin:0;padding-left:16px">'+
  (m.honest_caveats||[]).map(c=>'<li>'+c+'</li>').join('')+'</ul>';
document.getElementById('info').onclick = () => {
  panel.style.display = panel.style.display==='block' ? 'none' : 'block';
};
window.addEventListener('resize', ()=> G.width(window.innerWidth).height(window.innerHeight));
</script>
