function activeSets(){ if(hov.node) return hov; if(sel) return sel; return null; }
function nodeCol(n){
  if(cascadeOn) return (revealed && revealed.has(n.id)) ? n.col : n.colDim;
  const a = activeSets();
  if(a) return a.nodes.has(n) ? (hov.node===n ? n.colHi : n.col) : n.colDim;
  return (pulseOn && n.liveChg!=null && Math.abs(n.liveChg)>=2) ? n.colHi : n.col;
}
function cascL(l){ return cascadeOn && revealed && revealed.has(lid(l)) && revealed.has(ltd(l))
  && casc.has(lid(l)) && casc.has(ltd(l)); }
function linkCol(l){
  if(cascadeOn) return cascL(l) ? '#f0883e' : '#141c28';
  const a = activeSets();
  if(!a) return l.rcol;
  if(sel && !hov.node && sel.top.has(l)) return '#ffd166';
  return a.links.has(l) ? l.rcolHi : '#16202e';
}
function linkW(l){
  // field links stay width 0 in EVERY state: >0 turns a link into a cylinder mesh,
  // and 9.6k cylinders kill the frame rate (1px GL lines are the starfield look anyway)
  if(l.field) return 0;
  if(cascadeOn) return cascL(l) ? Math.max(1.8, l.wBase*1.2) : 0.25;
  const a = activeSets();
  if(!a) return l.wBase;
  if(sel && !hov.node && sel.top.has(l)) return Math.max(2.6, l.wBase*1.4);
  return a.links.has(l) ? Math.max(1.2, l.wBase*1.25) : 0.2;
}
function linkP(l){ return cascL(l) ? 4 : 0; }
function refresh(){ G.nodeColor(G.nodeColor()).linkColor(G.linkColor())
  .linkWidth(G.linkWidth()).linkDirectionalParticles(G.linkDirectionalParticles()); }

function onHover(n){
  if(cascadeOn) return;
  if((!n && !hov.nodes.size) || (n && hov.node===n)) return;
  hov.node = n||null; hov.nodes.clear(); hov.links.clear();
  if(n){ hov.nodes.add(n); n.neighbors.forEach(x=>hov.nodes.add(x)); n.nlinks.forEach(x=>hov.links.add(x)); }
  document.body.style.cursor = n ? 'pointer' : '';
  refresh();
}

function camTo(pt, dist){
  const r = Math.hypot(pt.x||0, pt.y||0, pt.z||0);
  const p = r>1 ? { x:pt.x*(1+dist/r), y:pt.y*(1+dist/r), z:pt.z*(1+dist/r) } : { x:0, y:0, z:dist };
  G.cameraPosition(p, pt, 900);
}

function focusNode(n){
  showCard(n);
  camTo(n, 130);
  if(!cascadeOn){
    const vl = n.nlinks.filter(l=>!l.field);
    const top = (vl.length?vl:n.nlinks).slice().sort((x,y)=>(y.usd||0)-(x.usd||0)).slice(0,3);
    sel = { node:n, nodes:new Set([n, ...n.neighbors]), links:new Set(n.nlinks), top:new Set(top) };
    refresh();
  }
}

function focusDeal(l){
  dealCard(l);
  const a = l.source, b = l.target;
  if(a && a.id && b && b.id){
    camTo({ x:(a.x+b.x)/2, y:(a.y+b.y)/2, z:(a.z+b.z)/2 }, 150);
    if(!cascadeOn){
      sel = { node:null, nodes:new Set([a,b]), links:new Set([l]), top:new Set([l]) };
      refresh();
    }
  }
}

function showCard(n){
  const card = document.getElementById('card');
  const q = (live && live.quotes) ? live.quotes[n.id] : null;
  const f8 = (live && live.edgar) ? live.edgar[n.id] : null;
  const seen = new Set();
  const mk = ls => ls.map(l => ({ o: otherEnd(n,l), usd:l.usd, fl:l.field }))
    .filter(p => p.o && (seen.has(p.o.id) ? false : seen.add(p.o.id))).slice(0,5);
  const byUsd = (a,b) => (b.usd||0)-(a.usd||0);
  const vp = mk(n.nlinks.filter(l=>!l.field).sort(byUsd));
  const fp = mk(n.nlinks.filter(l=>l.field).sort(byUsd).slice(0,5));
  const chipsHtml = [...vp, ...(vp.length<5?fp.slice(0,5-vp.length):[])].map(p =>
    '<button class="cpc" data-id="'+esc(p.o.id)+'">'+esc(p.o.label.length>30?p.o.label.slice(0,29)+'…':p.o.label)+
    (p.usd ? ' · $'+fmtB(p.usd)+(p.fl?' raw':'') : '')+'</button>').join('');
  card.innerHTML = '<div class="nm" style="color:'+(n.field?'#8fa8c4':n.col)+'">'+esc(n.label)+'</div>'+
    '<div class="ty">'+(n.field ? 'extracted party · raw layer' : (types[n.type]||n.type))+'</div>'+
    (n.note ? '<div class="nt">'+n.note+'</div>' : '')+
    (n.usd ? '<div class="usd">$'+(n.usd/1e9).toFixed(1)+'B committed</div>' : '')+
    (n.fieldDeals ? '<div class="fl">field: '+n.fieldDeals+' deals · $'+fmtB(n.fieldUsd||0)+' raw (unadjudicated)</div>' : '')+
    ((q && typeof q.chg_pct==='number') ? '<div class="pl '+(q.chg_pct<0?'dn':'up')+'">'+q.sym+
      ' $'+(+q.close).toFixed(2)+' · '+(q.chg_pct>=0?'+':'')+q.chg_pct.toFixed(1)+'%</div>' : '')+
    ((f8 && f8.new_8k_7d) ? '<div class="fl">'+f8.new_8k_7d+' new 8-K · 7d</div>' : '')+
    (chipsHtml ? '<div class="cps">'+chipsHtml+'</div>' : '');
  card.style.display='block';
}

function dealTags(l){
  const t=[];
  if(l.press) t.push('non-binding · press-only');
  if(l.circ) t.push('circular / vendor round-trip');
  const a=byId[lid(l)], b=byId[ltd(l)];
  if(a && b && a.frg>0.7 && b.frg>0.7) t.push('fragile both ends');
  else if(a && b && Math.max(a.frg,b.frg)>0.8) t.push('fragile counterparty');
  return t;
}

function dealCard(l){
  const card = document.getElementById('card');
  const bdg = l.field ? '<span class="bdg">raw extracted · unadjudicated</span>'
            : l.tier==='filing_verified' ? '<span class="bdg ok">filing-verified</span>'
            : l.press ? '<span class="bdg warn">press-only · non-binding</span>'
            : '<span class="bdg">source-backed</span>';
  const usdLine = !l.usd ? '' : l.field
    ? '<div class="usd">$'+fmtB(l.usd)+' raw · '+(l.nd||1)+' deal'+((l.nd||1)>1?'s':'')+'</div>'
    : '<div class="usd">$'+(l.usd/1e9).toFixed(1)+'B</div>';
  card.innerHTML = '<div class="nm">'+esc(l.flabel)+' → '+esc(l.tlabel)+'</div>'+
    '<div class="ty">'+(l.field ? 'collapsed deal link · obligor → risk-bearer' : l.type.replace(/_/g,' '))+'</div>'+
    bdg + dealTags(l).map(t=>'<span class="bdg warn">'+t+'</span>').join('')+
    usdLine+
    (l.note ? '<div class="nt">'+l.note+'</div>' : '')+
    '<div class="cps"><button class="cpc" data-id="'+esc(lid(l))+'">'+esc(l.flabel)+'</button>'+
    '<button class="cpc" data-id="'+esc(ltd(l))+'">'+esc(l.tlabel)+'</button></div>';
  card.style.display='block';
}

function shortList(ids){ const ns=ids.map(i=>byId[i]?byId[i].label:i);
  return ns.length<=2 ? ns.join(' · ') : ns[0]+' +'+(ns.length-1); }

function playCascade(){
  const btn = document.getElementById('play'), ccline = document.getElementById('ccline');
  if(cascadeOn){
    cascadeOn=false; if(cascadeTimer){ clearInterval(cascadeTimer); cascadeTimer=null; }
    revealed=null; btn.textContent='▶ Cascade'; ccline.style.opacity=0; refresh(); return;
  }
  cascadeOn=true; sel=null; hov.node=null; hov.nodes.clear(); hov.links.clear();
  btn.textContent='⏹ Cascade';
  revealed = new Set([trig]);
  const caps = [ trig+' withdraws' ].concat(hops.map(h =>
    h.hop+' · '+(h.usd ? '$'+(h.usd/1e9).toFixed(1)+'B · ' : '')+shortList(h.nodes||[])));
  const dbn = (meta.cascade_debt_at_risk_usd||0)/1e9;
  let step = 0;
  ccline.style.opacity=1; ccline.innerHTML = caps[0]; refresh();
  G.zoomToFit(900, 100, n => casc.has(n.id)); // frame the contagion path
  cascadeTimer = setInterval(()=>{
    step++;
    if(step <= hops.length){
      (hops[step-1].nodes||[]).forEach(id=>revealed.add(id));
      ccline.innerHTML = caps[step]; refresh();
    } else {
      clearInterval(cascadeTimer); cascadeTimer=null;
      ccline.innerHTML = trig+' → CoreWeave → lenders → households · <b>$'+dbn.toFixed(1)+'B at risk</b> (gross upper bound)';
    }
  }, 1200);
}

function applyLive(lv){
  live = lv || {}; let movers = 0;
  Object.keys(byId).forEach(id => { const q = live.quotes && live.quotes[id];
    byId[id].liveChg = (q && typeof q.chg_pct==='number') ? q.chg_pct : null;
    if(byId[id].liveChg!=null && Math.abs(byId[id].liveChg)>=2) movers++; });
  const t = Date.parse(live.generated_utc||'');
  if(!isNaN(t)){
    document.getElementById('lt').textContent = (live.generated_utc||'').slice(11,16)+'Z';
    document.getElementById('ld').style.color = (Date.now()-t) < 150*60000 ? '#3fb950' : '#6b7785';
    document.getElementById('livechip').style.display='';
  }
  if(movers && !pulseTimer) pulseTimer = setInterval(()=>{ pulseOn=!pulseOn;
    if(!cascadeOn && !hov.node && !sel) G.nodeColor(G.nodeColor()); }, 900);
}

function fillChips(){
  const $ = id => document.getElementById(id);
  $('m1').textContent = '$'+((meta.committed_core_usd||0)/1e9).toFixed(1)+'B';
  $('m2').textContent = '$'+((meta.original_inflated_basis_usd||0)/1e12).toFixed(2)+'T';
  $('m2b').textContent = (meta.over_count_removed_pct||0).toFixed(0)+'%';
  $('m3').textContent = '≈'+(meta.cluster_share_pct||0).toFixed(1)+'%';
  $('m4').textContent = meta.core_confidence;
  $('m5').textContent = meta.ecosystem_confidence;
  $('m6').textContent = (meta.crack_window||'').split(' ')[0].replace('..','–');
  $('c_core').title = 'Adjudicated committed debt of the financed AI-compute cluster ($'+
    ((meta.committed_incl_infra_usd||0)/1e9).toFixed(1)+'B including infra) — evidence-gated, not the headline aggregate';
  $('c_head').title = 'The inflated headline basis before adjudication — ~'+
    (meta.over_count_removed_pct||0).toFixed(0)+'% was over-count (duplicates, non-binding frameworks, non-AI debt)';
  $('c_cl').title = 'The leveraged cluster stays a small share of the classified AI-infra universe — bounded, not ecosystem-wide';
  $('c_conf').title = 'Core verdict: bubble dynamics present @ '+meta.core_confidence+
    ' confidence (financed compute cluster). Ecosystem-wide: NOT established @ '+meta.ecosystem_confidence+
    ' — held there by design. Not a final high-confidence verdict.';
  $('c_crack').title = meta.crack_window||'';
}

function boot(DATA){
  meta = DATA.meta; types = (DATA.legend||{}).node_types || {};
  const nodes = DATA.nodes.map(n => { const col = frgColor(n.fragility);
    return { id:n.id, label:n.label||n.id, type:n.type, frg:n.fragility||0, usd:n.usd||0,
      note:(n.note||'').split(/[.;]/)[0].trim(), col, colDim:dimOf(col), colHi:hiOf(col),
      val:Math.max(1.2, Math.sqrt((n.usd||0)/1e9)*1.7), neighbors:[], nlinks:[] }; });
  byId = {}; nodes.forEach(n => byId[n.id]=n);
  const links = DATA.edges.map(e => {
    const a=byId[e.from]||{}, b=byId[e.to]||{};
    const press = e.tier==='press_reported';
    const circ = e.type==='gpu_purchase' ||
      (e.from==='NVIDIA' && (e.type==='equity_investment' || e.type==='framework_commitment'));
    const risk = Math.min(1, 0.5*(((a.frg||0)+(b.frg||0))/2) + 0.35*(press?1:0) + 0.15*(circ?1:0));
    const rc = riskColor(risk);
    return { source:e.from, target:e.to, type:e.type, usd:e.usd, tier:e.tier, note:e.note||'',
      press, circ, risk, flabel:a.label||e.from, tlabel:b.label||e.to,
      rcol:rc, rcolHi:hiOf(rc),
      wBase: press ? 0.6 : Math.min(3.2, Math.max(0.5, Math.sqrt((e.usd||0)/1e9)*0.45)) };
  });
  // FIELD merge: the full extracted contract universe rendered faint behind the core.
  // Matched core entities anchor into the field; raw notionals stay labeled as raw.
  const fld = DATA.field;
  if (fld && fld.nodes && fld.links){
    const fIds = fld.nodes.map((r,i)=> (r[3] && byId[r[3]]) ? r[3] : ('f'+i));
    fld.nodes.forEach((r,i)=>{
      const cid = r[3];
      if (cid && byId[cid]){ byId[cid].fieldUsd=r[1]||0; byId[cid].fieldDeals=r[2]||0; return; }
      const fn = { id:'f'+i, label:r[0]||'(unnamed party)', type:'field_entity', frg:0, usd:0,
        fieldUsd:r[1]||0, fieldDeals:r[2]||0, field:true, note:'',
        col:'rgba(72,92,120,0.45)', colDim:'rgba(72,92,120,0.06)', colHi:'#7d9cc0',
        val:Math.max(0.08, Math.min(0.5, Math.log10(1+(r[1]||0))/20)), neighbors:[], nlinks:[] };
      nodes.push(fn); byId[fn.id]=fn;
    });
    fld.links.forEach(r=>{
      const a=fIds[r[0]], b=fIds[r[1]];
      if(a===b || !byId[a] || !byId[b]) return;
      links.push({ source:a, target:b, usd:r[2]||null, nd:r[3]||1, type:'deals',
        tier:'raw_extracted', note:'', press:false, circ:false, risk:0, field:true,
        flabel:byId[a].label, tlabel:byId[b].label,
        rcol:'rgba(96,118,148,0.10)', rcolHi:'rgba(150,175,205,0.6)', wBase:0.25 });
    });
  }

  links.forEach(l => { const a=byId[l.source], b=byId[l.target]; if(!a||!b) return;
    a.neighbors.push(b); b.neighbors.push(a); a.nlinks.push(l); b.nlinks.push(l); });

  trig = DATA.cascade.trigger;
  casc = new Set([trig]);
  (DATA.cascade.hops||[]).forEach(h => (h.nodes||[]).forEach(n => casc.add(n)));
  hops = DATA.cascade.hops || [];

  // always-on labels: the biggest entities + the cascade trigger and first hop
  const labeled = new Set(nodes.slice().sort((a,b)=>b.usd-a.usd).slice(0,8).map(n=>n.id));
  labeled.add(trig); (hops[0] && hops[0].nodes || []).forEach(id=>labeled.add(id));

  G = ForceGraph3D()(document.getElementById('g'))
    .backgroundColor('#05070c')
    .warmupTicks(0)
    .cooldownTicks(300)
    .cooldownTime(8000)
    .graphData({ nodes, links })
    .nodeLabel(n => esc(n.label))
    .nodeColor(nodeCol)
    .nodeVal(n => n.val)
    .nodeOpacity(0.95)
    .nodeThreeObjectExtend(true)
    .nodeThreeObject(n => {
      if (typeof SpriteText === 'undefined' || !labeled.has(n.id)) return undefined;
      const s = new SpriteText(n.label, 4.5, '#c9d4df');
      s.material.depthWrite = false;
      s.position.y = Math.cbrt(n.val)*4 + 6;
      return s;
    })
    .linkColor(linkCol)
    .linkWidth(linkW)
    .linkLabel(l => esc(l.flabel)+' → '+esc(l.tlabel)+' · '+(l.field
      ? (l.nd||1)+' deal'+((l.nd||1)>1?'s':'')+(l.usd ? ' · $'+fmtB(l.usd)+' raw' : '')
      : l.type.replace(/_/g,' ')+(l.usd ? ' · $'+(l.usd/1e9).toFixed(1)+'B' : '')))
    .linkDirectionalParticles(linkP)
    .linkDirectionalParticleWidth(2.2)
    .linkDirectionalParticleSpeed(0.012)
    .onNodeHover(onHover)
    .onNodeClick(focusNode)
    .onLinkClick(focusDeal)
    .onBackgroundClick(() => { document.getElementById('card').style.display='none';
      sel=null; if(!cascadeOn) refresh(); });
  G.d3Force('charge').strength(n => n.field ? -10 : -120);
  // field-link strength is degree-normalized: a hub with 100 raw deals must not feel
  // 100x the pull, or the core constellation gets stretched across the whole galaxy
  G.d3Force('link').distance(l => l.field ? 36 : 50).strength(l => {
    if(!l.field) return 0.85;
    const da = (byId[lid(l)]||{nlinks:[]}).nlinks.length || 1;
    const db = (byId[ltd(l)]||{nlinks:[]}).nlinks.length || 1;
    return 0.5 / Math.max(1, Math.min(da, db));
  });
  G.d3AlphaDecay(0.03).d3VelocityDecay(0.42);
  // gentle origin-gravity on core nodes only, so the verified constellation stays
  // coherent at convergence instead of scattering into its counterparties' clusters
  G.d3Force('coreGravity', (() => {
    let ns = [];
    const f = a => ns.forEach(n => { if(!n.field){
      n.vx -= n.x*0.03*a; n.vy -= n.y*0.03*a; n.vz -= n.z*0.03*a; } });
    f.initialize = arr => { ns = arr; };
    return f;
  })());
  // land the camera on the verified core constellation ONCE; any user input cancels
  // auto-framing forever so it can never fight wheel-zoom or drags
  let autoCam = true;
  ['wheel','pointerdown','touchstart'].forEach(ev =>
    document.getElementById('g').addEventListener(ev, () => { autoCam = false; }, { passive: true }));
  setTimeout(() => { if(autoCam) G.zoomToFit(800, 120, n => !n.field); }, 2200);
  G.onEngineStop(() => {
    if(autoCam){ autoCam = false; G.zoomToFit(1000, 90, n => !n.field); }
  });

  fillChips();
  if (fld && fld.entities){
    document.getElementById('m7').textContent = (fld.entities||0).toLocaleString('en-US');
    document.getElementById('m8').textContent = (fld.deals||0).toLocaleString('en-US');
    const fc = document.getElementById('c_field');
    fc.style.display=''; fc.title = fld.note||'';
  }
  const caveats = (meta.honest_caveats||[]).concat(fld && fld.note ? [fld.note] : []);
  const panel = document.getElementById('panel');
  panel.innerHTML = '<h4>Honest caveats · red-teamed</h4><ul style="margin:0;padding-left:16px">'+
    caveats.map(c=>'<li>'+c+'</li>').join('')+'</ul>';
  document.getElementById('info').onclick = () => {
    panel.style.display = panel.style.display==='block' ? 'none' : 'block';
  };
  document.getElementById('play').onclick = playCascade;

  // riskiest-deals panel: risk desc, then size desc — derived from fragility, binding tier, circularity
  deals = links.filter(l=>!l.field).sort((x,y)=> (y.risk-x.risk) || ((y.usd||0)-(x.usd||0))).slice(0,7);
  const dp = document.getElementById('dpanel');
  dp.innerHTML = '<h4>riskiest deals</h4>'+deals.map((l,i) =>
    '<div class="deal" data-i="'+i+'"><div class="dl">'+(l.usd?'<b>$'+(l.usd/1e9).toFixed(1)+'B</b> ':'')+
    l.flabel+' → '+l.tlabel+'</div><div class="dwhy">'+
    [...dealTags(l), (l.note||'').split(/[.;(]/)[0].trim()].filter(Boolean).join(' · ')+'</div></div>').join('');
  dp.addEventListener('click', e => {
    const row = e.target.closest('.deal');
    if(row && deals[+row.dataset.i]) focusDeal(deals[+row.dataset.i]);
  });
  document.getElementById('deals').onclick = () => {
    dp.style.display = dp.style.display==='block' ? 'none' : 'block';
  };

  document.getElementById('card').addEventListener('click', e => {
    const id = e.target && e.target.getAttribute && e.target.getAttribute('data-id');
    if (id && byId[id]) focusNode(byId[id]);
  });
  window.addEventListener('resize', ()=> G.width(window.innerWidth).height(window.innerHeight));
  fetch('live.json?v='+Date.now()).then(r => r.ok ? r.json() : Promise.reject())
    .then(applyLive).catch(()=>{});
}

// Async-load the committed dataset (hourly-refreshable on GitHub Pages);
// the embedded copy keeps the file self-contained for file:// opens.
fetch('graph_data.json?v='+Date.now()).then(r => r.ok ? r.json() : Promise.reject())
  .then(boot).catch(() => boot(EMBEDDED));
</script>
