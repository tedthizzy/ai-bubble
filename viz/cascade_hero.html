<style>

  html,body{margin:0;padding:0;height:100%;}
  body{

    font-size:14px;
    overflow:hidden;
  }
  #app{height:100vh;position:relative;}

  /* ---- Graph fills the screen ---- */
  #body{position:absolute;inset:0;}
  #graph{position:absolute;inset:0;background:radial-gradient(circle at 50% 40%,#0e141c,#07090d 75%);}
  #network{position:absolute;inset:0;}

  /* ---- Persistent chrome: wordmark + glance-chips (top-left) ---- */
  .ov{position:absolute;z-index:6;}
  #brand{top:14px;left:16px;}
  #brand .m{font-weight:700;letter-spacing:.14em;font-size:12px;color:var(--muted);}
  #brand .chips{margin-top:7px;display:flex;gap:6px;flex-wrap:wrap;}
  .chip{font-size:11px;padding:2px 8px;border-radius:999px;border:1px solid var(--border);background:var(--panel);white-space:nowrap;}
  .chip b{color:var(--warn);}
  .chip.eco b{color:var(--good);}
  .chip.final{color:var(--muted);}

  /* safe -> fragile scale ---- */
  #scale{top:64px;left:16px;font-size:10px;color:#6b7785;}
  #scale i{display:inline-block;width:46px;height:6px;border-radius:3px;vertical-align:middle;margin:0 6px;
           background:linear-gradient(90deg,#3ad29f,#ffb454,#ff5d5d);}

  /* "i" honesty toggle (top-right) ---- */
  #info{top:14px;right:16px;width:26px;height:26px;border-radius:50%;border:1px solid #2a3a4a;
        background:var(--panel);color:var(--muted);font-size:13px;cursor:pointer;}
  #info:hover{color:var(--text);border-color:var(--muted);}

  /* caveats panel (HIDDEN by default, behind "i") ---- */
  #caveats{
    top:50px;right:16px;width:340px;max-height:74vh;overflow:auto;display:none;
    background:rgba(13,18,24,.96);border:1px solid #4a3a18;border-radius:10px;
    padding:12px 14px;font-size:12px;line-height:1.5;z-index:6;
  }
  #caveats h4{margin:0 0 8px;font-size:11px;letter-spacing:.08em;color:var(--muted);text-transform:uppercase;}
  #caveats .v{margin:0 0 8px;font-size:11.5px;color:#cdd7e2;}
  #caveats .v b{font-family:ui-monospace,Menlo,monospace;}
  #caveats ul{margin:0;padding-left:16px;}
  #caveats li{margin:6px 0;color:#e7d9bf;line-height:1.45;}
  #caveats .stat{margin-top:9px;padding-top:8px;border-top:1px solid var(--border);color:var(--muted);font-size:11px;line-height:1.5;}
  #caveats .stat b{color:var(--text);font-family:ui-monospace,Menlo,monospace;}

  /* ---- Cascade controls (bottom-left) ---- */
  #cc{left:16px;bottom:16px;display:flex;align-items:center;gap:12px;z-index:6;}
  button.act{
    background:linear-gradient(180deg,#1d2a3d,#16202e);
    color:var(--text);border:1px solid #2c4a6e;border-radius:8px;
    padding:9px 14px;font-size:13px;font-weight:600;cursor:pointer;transition:.12s;
  }
  button.act:hover{background:linear-gradient(180deg,#243751,#1b283a);border-color:var(--accent);}
  button.act:active{transform:translateY(1px);}
  button.ghost{background:transparent;border:1px solid var(--border);color:var(--muted);}
  button.ghost:hover{color:var(--text);border-color:var(--muted);}
  /* one-line $ figure, shown only while a cascade is playing */
  #ccline{font-size:12px;color:var(--muted);opacity:0;transition:.3s;max-width:46vw;}
  #ccline .big{font-family:ui-monospace,Menlo,monospace;font-weight:700;color:var(--warn);font-size:15px;}
  #ccline .gub{color:var(--bad);}

  /* ---- Compact node card (bottom-right, only on click) ---- */
  #card{
    right:16px;bottom:16px;width:300px;max-height:72vh;overflow:auto;display:none;
    background:rgba(13,18,24,.96);border:1px solid var(--border);border-radius:10px;
    padding:12px 14px;z-index:6;
  }
  #card .dtitle{font-size:16px;font-weight:700;margin-bottom:2px;}
  #card .dtype{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;margin-bottom:8px;}
  #card .pill{display:inline-block;border-radius:20px;padding:2px 9px;font-size:11px;font-weight:600;margin:0 6px 6px 0;}
  #card .note{font-size:12.5px;line-height:1.5;color:#cdd7e2;margin:8px 0;}
  #card .meterwrap{margin:8px 0;}
  #card .meterlab{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-bottom:3px;}
  #card .meter{height:7px;border-radius:4px;background:#1d2531;overflow:hidden;}
  #card .meter > div{height:100%;border-radius:4px;}
  #card .edges{margin-top:10px;}
  h3.sec{font-size:11px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);margin:0 0 8px;font-weight:700;}
  #card .edge{
    border:1px solid var(--border);border-radius:7px;padding:7px 9px;margin-bottom:6px;
    background:var(--panel2);font-size:12px;
  }
  #card .edge .ehead{display:flex;justify-content:space-between;gap:8px;align-items:baseline;}
  #card .edge .earrow{font-weight:600;}
  #card .edge .etier{font-size:9.5px;text-transform:uppercase;letter-spacing:.5px;padding:1px 6px;border-radius:10px;white-space:nowrap;}
  .tier-filing_verified{background:#143024;color:#5fe0a8;}
  .tier-source_backed{background:#142433;color:#6fb6ff;}
  .tier-press_reported{background:#2a1538;color:#d6a4ff;border:1px dashed #8a4fc0;}
  #card .edge .enote{color:var(--muted);font-size:11.5px;margin-top:4px;line-height:1.4;}
  #card .edge .eusd{font-family:ui-monospace,Menlo,monospace;color:var(--text);}
  .nonbinding{color:var(--press);font-weight:700;font-size:11px;}

/* ============================================================
   Helpers
   ============================================================ */
function fmtUsd(v){
  if(v === null || v === undefined) return "—";
  const abs = Math.abs(v);
  if(abs >= 1e12) return "$" + (v/1e12).toFixed(2) + "T";
  if(abs >= 1e9)  return "$" + (v/1e9).toFixed(v/1e9 >= 100 ? 1 : 2) + "B";
  if(abs >= 1e6)  return "$" + (v/1e6).toFixed(0) + "M";
  return "$" + v.toLocaleString();
}

// fragility (0 safe .. 1 fragile) -> green->amber->red
function fragColor(f){
  // 0 -> green (58,210,159), 0.5 -> amber (255,180,84), 1 -> red (255,93,93)
  let r,g,b;
  if(f <= 0.5){
    const t = f/0.5;
    r = Math.round(58  + (255-58)*t);
    g = Math.round(210 + (180-210)*t);
    b = Math.round(159 + (84-159)*t);
  } else {
    const t = (f-0.5)/0.5;
    r = Math.round(255 + (255-255)*t);
    g = Math.round(180 + (93-180)*t);
    b = Math.round(84  + (93-84)*t);
  }
  return "rgb("+r+","+g+","+b+")";
}

const TYPE_SHAPE = {
  issuer:"dot",
  supplier_investor:"diamond",
  fragile_offtaker:"star",
  durable_offtaker:"square",
  lender:"triangle",
  end_holder:"hexagon",
  energy_chokepoint:"triangleDown"
};

// node size from usd (sqrt scale)
const usdVals = DATA.nodes.map(n=>n.usd||0);
const maxUsd = Math.max(...usdVals);
function nodeSize(usd){
  const s = Math.sqrt((usd||0)/maxUsd); // 0..1
  return 12 + s*42;
}

// adjacency (directed, outward) over ALL edges
const adj = {};
DATA.nodes.forEach(n=>adj[n.id]=[]);
DATA.edges.forEach((e,i)=>{ if(adj[e.from]) adj[e.from].push({to:e.to, edgeIndex:i}); });

const nodeById = {};
DATA.nodes.forEach(n=>nodeById[n.id]=n);

function firstClause(s){ return (s||"").split(/[.;]/)[0].trim(); }

const cardEl = document.getElementById("card");
function showDetail(nodeId){
  const n = nodeById[nodeId];
  if(!n) return;
  const out = [];
  out.push('<div class="dtitle">'+n.label+'</div>');
  out.push('<div class="dtype">'+n.type.replace(/_/g," ")+'</div>');

  out.push('<span class="pill" style="background:'+fragColor(n.fragility)+';color:#05080b;">fragility '+n.fragility.toFixed(2)+'</span>');
  out.push('<span class="pill" style="background:#1c2a3d;color:#bcd6ff;">'+fmtUsd(n.usd)+' exposure</span>');

  out.push('<div class="meterwrap"><div class="meter"><div style="width:'+(n.fragility*100)+'%;background:'+fragColor(n.fragility)+';"></div></div></div>');

  if(n.note) out.push('<div class="note">'+firstClause(n.note)+'</div>');

  // edges in/out (kept — this is where the full evidence lives)
  const outEdges = DATA.edges.map((e,i)=>({e,i})).filter(o=>o.e.from===nodeId);
  const inEdges  = DATA.edges.map((e,i)=>({e,i})).filter(o=>o.e.to===nodeId);

  function edgeBlock(o, dir){
    const e=o.e;
    const arrow = dir==="out" ? (n.label+' → '+e.to) : (e.from+' → '+n.label);
    let h = '<div class="edge">';
    h += '<div class="ehead"><span class="earrow">'+arrow+'</span><span class="etier tier-'+e.tier+'">'+tierLabel(e.tier)+'</span></div>';
    h += '<div class="enote"><span style="color:#9fb3c6;">'+e.type.replace(/_/g," ")+'</span> · <span class="eusd">'+fmtUsd(e.usd)+'</span>';
    if(e.tier==="press_reported") h += ' · <span class="nonbinding">NON-BINDING</span>';
    h += '</div>';
    if(e.note) h += '<div class="enote">'+e.note+'</div>';
    h += '</div>';
    return h;
  }

  if(outEdges.length){
    out.push('<div class="edges"><h3 class="sec">Outgoing — downstream exposure</h3>');
    outEdges.forEach(o=>out.push(edgeBlock(o,"out")));
    out.push('</div>');
  }
  if(inEdges.length){
    out.push('<div class="edges"><h3 class="sec">Incoming</h3>');
    inEdges.forEach(o=>out.push(edgeBlock(o,"in")));
    out.push('</div>');
  }

  cardEl.innerHTML = out.join("");
  cardEl.style.display = "block";
}

/* ============================================================
   Contagion: BFS outward + dim everything else + running total
   ============================================================ */
let animTimers = [];
function clearTimers(){ animTimers.forEach(t=>clearTimeout(t)); animTimers=[]; }

function dimAll(){
  const upd = nodesDS.get().map(nd=>{
    const f = nd._base.fragility;
    return {id:nd.id, color:{background:"rgba(40,48,58,.55)",border:"#1a2230",
      highlight:{background:fragColor(f),border:"#ffffff"}, hover:{background:fragColor(f),border:"#ffffff"}},

  const eupd = edgesDS.get().map(ed=>{
    const press = ed._base.tier==="press_reported";
    return {id:ed.id, color:{color:press?"rgba(120,80,160,.18)":"rgba(80,100,120,.12)"}, width: press?1.5:1};
  });
  edgesDS.update(eupd);
}

function restoreNode(id, opts){
  const nd = nodesDS.get(id); if(!nd) return;
  const f = nd._base.fragility;
  nodesDS.update({id:id,
    color:{background:fragColor(f),border:opts&&opts.ring?opts.ring:"#ffffff",
      highlight:{background:fragColor(f),border:"#ffffff"}, hover:{background:fragColor(f),border:"#ffffff"}},
    font:{color:"#ffffff",size:14,strokeWidth:4,strokeColor:"#05070a"},
    borderWidth:opts&&opts.width?opts.width:3});
}

function litEdge(edgeIndex){
  const ed = edgesDS.get(edgeIndex); if(!ed) return;
  const press = ed._base.tier==="press_reported";
  edgesDS.update({id:edgeIndex, color:{color:press?"#e3b4ff":"#ffcf6b"}, width: press?2.6:3});

/* one-line $ figure, shown only while a cascade is playing */
const cclineEl = document.getElementById("ccline");
function showCcline(html){ cclineEl.innerHTML = html; cclineEl.style.opacity = 1; }
function hideCcline(){ cclineEl.style.opacity = 0; }

// BFS outward producing layered frontier (list of {level, ids:[], edgeIdx:[]})
function bfsLayers(startId){
  const visited = new Set([startId]);
  const layers = [{level:0, ids:[startId], edges:[]}];
  let frontier = [startId];
  let guard=0;
  while(frontier.length && guard++ < 50){
    const nextIds = [];
    const nextEdges = [];
    frontier.forEach(id=>{
      (adj[id]||[]).forEach(link=>{
        nextEdges.push(link.edgeIndex);
        if(!visited.has(link.to)){
          visited.add(link.to);
          nextIds.push(link.to);
        }
      });
    });
    if(nextIds.length===0 && nextEdges.length===0) break;
    layers.push({level:layers.length, ids:nextIds, edges:nextEdges});
    frontier = nextIds;
    if(nextIds.length===0) break;
  }
  return layers;
}

// Generic click-to-trace contagion (sums committed/exposure usd of reached nodes)
function traceContagion(startId){
  clearTimers();
  showDetail(startId);
  dimAll();

  const layers = bfsLayers(startId);
  let running = 0;
  let delay = 0;
  const step = 460;

  layers.forEach((layer)=>{
    const t = setTimeout(()=>{
      // light edges of this layer
      layer.edges.forEach(ei=>litEdge(ei));
      // light nodes
      layer.ids.forEach((id, k)=>{
        restoreNode(id, {ring: id===startId ? "#ffffff" : "#ffcf6b", width: id===startId?4:3});
        running += (nodeById[id] && nodeById[id].usd) ? nodeById[id].usd : 0;
      });
      showCcline('hop '+layer.level+' · <span class="big">'+fmtUsd(running)+
        '</span> exposure surface <span class="gub">(gross upper bound)</span>');
    }, delay);
    animTimers.push(t);
    delay += step;
  });

  // focus camera
  network.fit({nodes:Array.from(new Set(layers.flatMap(l=>l.ids))), animation:{duration:600}});
}

/* ============================================================
   Scripted cascade replay (uses DATA.cascade hops verbatim)
   ============================================================ */
function replayCascade(){
  clearTimers();
  const trig = DATA.cascade.trigger;
  showDetail(trig);
  dimAll();
  network.selectNodes([trig]);

  let delay = 0;
  const step = 950;
  const gubFigure = fmtUsd(DATA.cascade.hops[0].usd);

  // step 0: trigger
  animTimers.push(setTimeout(()=>{
    restoreNode(trig,{ring:"#ffffff",width:4});
    showCcline('trigger · '+trig);
    // light the OpenAI->CoreWeave edge
    DATA.edges.forEach((e,i)=>{ if(e.from===trig && e.to==="CoreWeave") litEdge(i); });
  }, delay));
  delay += step;

  let prevNodes = [trig];
  DATA.cascade.hops.forEach((hop)=>{
    animTimers.push(setTimeout(()=>{
      // light edges from any previously-lit node into this hop's nodes
      const hopSet = new Set(hop.nodes);
      DATA.edges.forEach((e,i)=>{
        if(prevNodes.includes(e.from) && hopSet.has(e.to)) litEdge(i);
      });
      hop.nodes.forEach(id=>{ restoreNode(id,{ring:"#ffcf6b",width:3}); });
      showCcline('hop '+hop.hop+' → '+hop.nodes.join(", ")+' · <span class="big">'+
        fmtUsd(hop.usd || DATA.cascade.hops[0].usd)+'</span>');
      prevNodes = prevNodes.concat(hop.nodes);
      network.fit({nodes:prevNodes, animation:{duration:550}});
    }, delay));
    delay += step;
  });

  // final summary clamp to the cascade gross-upper-bound figure
  animTimers.push(setTimeout(()=>{
    showCcline('OpenAI → CoreWeave → lenders → households · <span class="big">'+gubFigure+
      '</span> at risk <span class="gub">(gross upper bound)</span>');
  }, delay));
}

network.on("click", (params)=>{
  if(params.nodes && params.nodes.length){
    traceContagion(params.nodes[0]);
  } else if(params.edges && params.edges.length){
    // clicking an edge: show its endpoints' detail via the 'from' node
    const ed = edgesDS.get(params.edges[0]);
    if(ed) showDetail(ed._base.from);
  } else {
    // background click: dismiss the compact card
    cardEl.style.display = "none";
  }
});
