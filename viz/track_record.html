<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bubble / Record</title>
<style>
:root { color-scheme:dark; --font:Arial,sans-serif; --text:14px; --title:18px; --background:#05070c; --surface:#0c1420; --ink:#e6edf3; --muted:#adb8c8; --accent:#cba978; --border:#354252; }
* { box-sizing:border-box; }
body { margin:0; background:var(--background); color:var(--ink); font:var(--text)/1.5 var(--font); }
.wrap { max-width:920px; margin:0 auto; padding:24px 20px 64px; }
h1,h2 { font-size:var(--title); line-height:1.4; }
h1 { margin:0 0 8px; } h2 { margin:28px 0 10px; }
p { margin:8px 0; } a { color:var(--ink); text-underline-offset:3px; }
a:focus-visible,summary:focus-visible { outline:2px solid var(--accent); outline-offset:3px; }
.card { background:var(--surface); border:1px solid var(--border); border-radius:8px; padding:14px 16px; margin:10px 0; overflow-wrap:anywhere; }
.table-scroll { overflow-x:auto; } table { border-collapse:collapse; width:100%; font:inherit; }
th,td { text-align:left; padding:8px; border-bottom:1px solid var(--border); vertical-align:top; }
#expectations td { overflow-wrap:normal; }
#expectations td:nth-child(2),#expectations td:nth-child(3),#expectations td:nth-child(4) { white-space:nowrap; }
th,.sub,.muted,.days { color:var(--muted); } code { font:inherit; }
.pill { display:inline-block; padding:1px 7px; border:1px solid var(--border); border-radius:4px; white-space:nowrap; }
.signal { padding:10px 0; border-bottom:1px solid var(--border); }
.signal:last-child { border:0; }
.signal header { display:flex; flex-wrap:wrap; gap:8px 16px; align-items:baseline; }
.big { font-size:var(--title); font-weight:700; }
.barwrap { background:var(--border); border-radius:4px; height:8px; overflow:hidden; max-width:360px; margin:8px 0 12px; }
.bar { height:100%; background:var(--accent); }
.ev { display:flex; gap:10px; padding:8px 0; border-bottom:1px solid var(--border); }
.days { min-width:45px; } details { margin:12px 0; } summary { cursor:pointer; }
@media (max-width:600px) { .wrap { padding:16px 12px 48px; } .card { padding:12px; } th,td { padding:6px; } }
@media (prefers-reduced-motion:reduce) { *,*::before,*::after { animation:none!important; transition:none!important; scroll-behavior:auto!important; } }
</style>
</head>
<body>
<main class="wrap">
<h1>Record</h1>
<a href="./index.html">Visualization</a>
<p class="muted" id="stamp"></p>
<h2>Signals</h2>
<p class="sub"><a href="https://github.com/tedthizzy/ai-bubble/blob/main/analysis/preregistered_signals.md">Registered definitions</a></p>
<div id="signals" class="card" aria-live="polite">Loading</div>
<h2>Shadow forecast</h2>
<p class="sub"><a href="https://github.com/tedthizzy/ai-bubble/blob/main/analysis/verdict_tree.md">Forecast method</a></p>
<div id="verdict" class="card" aria-live="polite">Loading</div>
<h2>Brier score</h2>
<div id="brier" class="card"></div>
<h2>Calendar</h2>
<div id="calendar" class="card" aria-live="polite">Loading</div>
<h2>Expectations</h2>
<p class="sub"><a href="https://github.com/tedthizzy/ai-bubble/blob/main/analysis/expectations_inversion.md">Inputs and assumptions</a></p>
<div id="expectations" class="card" aria-live="polite">Loading</div>
</main>
<script>
'use strict';
const $=id=>document.getElementById(id);
const esc=value=>String(value==null?'':value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function get(u,lines=false) {
 const response=await fetch(u+'?cb='+Date.now());
 if(!response.ok)throw Error('Unavailable: '+u);
 return lines ? (await response.text()).trim().split('\n').filter(Boolean).map(line=>JSON.parse(line)) : response.json();
}
const pill=status=>'<span class="pill">'+esc(status)+'</span>';
const table=(head,rows)=>'<div class="table-scroll" tabindex="0"><table><thead><tr>'+head.map(h=>'<th>'+h+'</th>').join('')+'</tr></thead><tbody>'+rows+'</tbody></table></div>';
(async()=>{
 const files=['live.json','history.jsonl','calendar.json','expectations.json'];
 const result=await Promise.allSettled(files.map(file=>get('./'+file,file.endsWith('.jsonl'))));
 const [live,hist,cal,exp]=result.map((row,i)=>row.status==='fulfilled'?row.value:(i===1?[]:{}));
 const failures=result.flatMap((row,i)=>row.status==='rejected'?[files[i]]:[]);
 const stamp=live.generated_utc ? new Date(live.generated_utc).toLocaleString('en-US',{timeZone:'America/Los_Angeles',hour12:false})+' Pacific' : 'Unavailable';
 $('stamp').textContent='Overlay '+stamp+' / '+hist.length+' history days'+(failures.length?' / Unavailable: '+failures.join(', '):'');
 const sigs=live.signals||[];
 $('signals').innerHTML=sigs.length ? sigs.map(s=>'<div class="signal"><header><b>'+esc(s.id)+'</b>'+pill(s.status)+'</header><p class="muted">'+esc(s.desc||'')+'</p></div>').join('') : 'Signals unavailable.';
 const v=live.verdict_shadow;
 if(v&&Number.isFinite(v.p_real)) {
  const pct=(v.p_real*100).toFixed(0);
  $('verdict').innerHTML='<div class="big">'+pct+'% P_real (shadow)</div><div class="barwrap"><div class="bar" style="width:'+pct+'%"></div></div>'+table(['Pathway','Probability'],
   '<tr><td>Operations first</td><td>'+(v.pathway_operations_first*100).toFixed(0)+'%</td></tr><tr><td>Funding closes first</td><td>'+(v.pathway_funding_first*100).toFixed(0)+'%</td></tr>')+
   '<p class="muted">Original registered priors with signal adjustments. Outcome window ends '+esc(v.p_real_outcome_window_end||'2027-09-30')+'.</p><p class="muted">Historical structural confidence: '+esc(v.structural_confidence_unchanged)+' ('+esc(v.structural_judgment_as_of||'2026-06-03')+'). This is a historical judgment. No calibrated bubble probability is available.</p>';
 } else $('verdict').textContent='Shadow forecast unavailable.';
 $('brier').textContent='No scored issuer outcomes are published in this ledger. P_real resolves on a verified qualifying issuer event through September 30, 2027, or after that window closes with complete event coverage. The 2026-Q4 TIMING-KILL criterion is separate. A constant 0.5 forecast has a Brier benchmark of 0.25.';
 if(cal&&Array.isArray(cal.upcoming)) {
  const events=cal.upcoming.length?cal.upcoming:(cal.all||[]).filter(e=>e.days_until>=0).slice(0,4);
  $('calendar').innerHTML=events.map(e=>'<div class="ev"><span class="days">'+esc(e.days_until)+'d</span><span><b>'+esc(e.label)+'</b> <span class="muted">['+esc(e.kind)+']</span><br><span class="muted">'+esc(e.why)+'</span></span></div>').join('')||'No upcoming events in the registered calendar.';
 } else $('calendar').textContent='Calendar unavailable.';
 if(exp&&Array.isArray(exp.results)&&exp.results.length) {
  const rows=exp.results.map(r=>{
   const m=r.implied_revenue_multiple,s=r.renewal_dependent_share;
   const mt=Number.isFinite(m.low)&&Number.isFinite(m.high)?m.low.toFixed(1)+' to '+m.high.toFixed(1)+'x':'Unavailable';
   const st=Number.isFinite(s.low)&&Number.isFinite(s.high)?(s.low*100).toFixed(0)+' to '+(s.high*100).toFixed(0)+'%':'Unavailable';
   return '<tr><td><b>'+esc(r.ticker)+'</b> '+esc(r.name)+'</td><td>$'+r.ev_usd_b.toFixed(2)+'B</td><td>'+mt+'</td><td>'+st+'</td></tr>';
  }).join('');
  $('expectations').innerHTML=table(['Name','EV','Implied revenue multiple','Renewal-dependent share of EV'],rows)+'<p class="muted">Reviewed '+esc(exp.as_of)+'. Market close '+esc(exp.market_close)+'. Consolidated reported trailing revenue. Recognition timing and FCF margins are assumptions.</p><p class="muted">Renewal-dependent share is EV beyond modeled contracted cash-flow PV. New customers, expansion and other businesses can also supply that value.</p>'+exp.results.map(r=>'<details><summary>'+esc(r.ticker)+' inputs</summary><p>'+esc(r.revenue_basis)+'</p><p>'+esc(r.backlog_basis)+'</p><p>'+esc(r.notes)+'</p></details>').join('');
 } else $('expectations').textContent='Expectations inputs unavailable.';
})().catch(()=>{$('stamp').textContent+=' / Record could not be rendered.';});
</script>
</body>
</html>
