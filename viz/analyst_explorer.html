<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Analyst Explorer — Burry Forensic Engine</title>
<script src="https://unpkg.com/cytoscape@3.34.0/dist/cytoscape.min.js"></script>
<style>
  :root{
    --bg:#0b0e13;
    --panel:#11161f;
    --panel2:#161d28;
    --border:#222c3a;
    --txt:#d8e0ec;
    --muted:#8a97a8;
    --accent:#4ea1ff;
    --warn:#ffb454;
    --danger:#ff5a5a;
    --ok:#36d399;
    --press:#c77dff;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);overflow:hidden;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    font-size:13px;line-height:1.45;}
  a{color:var(--accent);}

  /* ---------- minimal floating chrome ---------- */
  .ov{position:fixed;z-index:6;}
  #brand{top:14px;left:16px;}
  #brand .m{font-weight:700;letter-spacing:.14em;font-size:11px;color:var(--muted);}
  #brand .chips{margin-top:7px;display:flex;gap:6px;align-items:center;}
  .chip{font-size:11px;padding:2px 8px;border-radius:999px;border:1px solid var(--border);
    background:var(--panel);color:var(--muted);}
  .chip b{color:var(--warn);} .chip.r b{color:#ff8e72;} .chip.g{color:#7d8893;}
  #brand .scale{margin-top:7px;font-size:10px;color:#6b7785;}
  #brand .scale i{display:inline-block;width:42px;height:6px;border-radius:3px;vertical-align:middle;
    margin:0 6px;background:linear-gradient(90deg,#36d399,#ffb454,#ff5a5a);}

  #info{top:14px;right:16px;width:26px;height:26px;border-radius:50%;border:1px solid var(--border);
    background:var(--panel);color:var(--muted);font-size:13px;cursor:pointer;}
  #info:hover{border-color:var(--accent);}

  /* forensic-honesty panel (hidden behind the "i" toggle) */
  #forensic{top:48px;right:16px;width:360px;max-height:74vh;overflow:auto;display:none;
    border:1px solid var(--border);border-radius:10px;background:rgba(13,18,26,.96);
    padding:13px 15px;font-size:12px;line-height:1.5;}
  #forensic h4{margin:0 0 8px;font-size:10px;letter-spacing:.08em;color:var(--muted);text-transform:uppercase;}
  #forensic .verdicts{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px;}
  .verdict{border:1px solid var(--border);border-radius:6px;padding:4px 9px;background:var(--panel);
    font-size:11px;display:flex;align-items:center;gap:6px;}
  .verdict .k{color:var(--muted);}
  .verdict .v{font-weight:700;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;}
  .verdict.core .v{color:var(--warn);} .verdict.eco .v{color:#ff8e72;} .verdict.final .v{color:var(--danger);}
  .conds li{margin:5px 0;color:#bfe9d6;} .conds .met{color:var(--ok);font-weight:700;}
  .caveats li{margin:5px 0;color:#c7d2e0;}

  /* ---------- layout ---------- */
  .wrap{display:flex;height:100vh;}
  #left{flex:1 1 auto;display:flex;flex-direction:column;min-width:0;}

  .toolbar{position:fixed;left:50%;transform:translateX(-50%);bottom:14px;z-index:6;
    display:flex;flex-wrap:wrap;gap:6px;padding:7px 9px;border:1px solid var(--border);
    border-radius:10px;background:rgba(13,18,26,.92);backdrop-filter:blur(4px);align-items:center;
  }
  .tbtn{
    border:1px solid var(--border);background:var(--panel2);color:var(--txt);
    padding:5px 10px;border-radius:6px;cursor:pointer;font-size:12px;transition:.12s;
  }
  .tbtn:hover{border-color:var(--accent);}
  .tbtn.active{background:var(--accent);color:#06223f;border-color:var(--accent);font-weight:700;}
  .tbtn .cnt{opacity:.7;font-size:11px;}

  #cywrap{position:relative;flex:1 1 auto;min-height:0;}
  #cy{position:absolute;inset:0;}

  /* ---------- detail card (only on node click) ---------- */
  #right{
    position:fixed;right:16px;bottom:64px;width:340px;max-height:72vh;z-index:6;display:none;
    border:1px solid var(--border);border-radius:10px;
    background:rgba(13,18,26,.96);flex-direction:column;overflow:hidden;
  }
  #right.show{display:flex;}
  .right-head{padding:10px 14px;border-bottom:1px solid var(--border);display:flex;
    align-items:center;justify-content:space-between;}
  .right-head .ttl{font-size:13px;font-weight:700;}
  .right-head .x{cursor:pointer;color:var(--muted);font-size:15px;}
  .right-body{padding:12px 14px;overflow:auto;flex:1 1 auto;}
  .empty-hint{color:var(--muted);font-size:12px;}

  .detail-name{font-size:16px;font-weight:700;margin-bottom:2px;}
  .detail-type{display:inline-block;font-size:11px;color:var(--muted);
    border:1px solid var(--border);border-radius:4px;padding:1px 7px;margin-bottom:12px;}
  .kv{display:grid;grid-template-columns:120px 1fr;gap:4px 10px;margin:10px 0;font-size:12px;}
  .kv .k{color:var(--muted);}
  .kv .v{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;}
  .note{background:var(--panel2);border:1px solid var(--border);border-radius:6px;
    padding:10px 12px;font-size:12px;color:var(--txt);margin-top:8px;}
  .note .nlbl{display:block;color:var(--muted);font-size:10px;text-transform:uppercase;
    letter-spacing:.6px;margin-bottom:4px;}
  .frag-bar{height:8px;border-radius:4px;background:#1d2735;overflow:hidden;margin-top:4px;}
  .frag-bar > i{display:block;height:100%;}
  .redteam{margin-top:10px;font-size:12px;padding:8px 11px;border-radius:6px;
    border:1px solid #5a4a22;background:#231c10;color:var(--warn);}
  .chokeflag{margin-top:10px;font-size:12px;padding:8px 11px;border-radius:6px;
    border:1px solid #2a5a4a;background:#0f221c;color:var(--ok);}
  .edge-row{border-top:1px solid var(--border);padding:8px 0;font-size:12px;}
  .edge-row:first-child{border-top:none;}
  .edge-dir{font-weight:600;}
  .tier{font-size:10px;text-transform:uppercase;letter-spacing:.5px;padding:1px 6px;border-radius:4px;}
  .tier.filing_verified{background:#13321f;color:var(--ok);border:1px solid #2a5a3a;}
  .tier.source_backed{background:#13243a;color:#7fb6ff;border:1px solid #2a4a6a;}
  .tier.press_reported{background:#2a1430;color:var(--press);border:1px solid #5a2a6a;}

  /* ---------- cascade one-liner (only while a routing filter is active) ---------- */
  #cascadeBanner{position:fixed;left:50%;transform:translateX(-50%);bottom:62px;z-index:6;
    display:none;padding:6px 14px;border:1px solid #6a3a1a;border-radius:8px;
    background:rgba(42,22,6,.94);color:var(--warn);font-size:12px;white-space:nowrap;
    max-width:90vw;overflow:hidden;text-overflow:ellipsis;backdrop-filter:blur(4px);}
  #cascadeBanner.show{display:block;}
  #cascadeBanner b{color:#ffd9a3;}
</style>
</head>

<!-- minimal persistent chrome: wordmark + glance-chips + safe→fragile scale -->
<div class="ov" id="brand">
  <div class="m">BURRY · AI-INFRA</div>
  <div class="chips">
    <span class="chip">core <b>0.67</b></span>
    <span class="chip r">ecosystem <b>0.25</b></span>
    <span class="chip g">not final</span>
  </div>
  <div class="scale">safe <i></i> fragile</div>
</div>

<button class="ov" id="info" title="forensic honesty">i</button>

<!-- forensic honesty (hidden by default, behind the "i" toggle) -->
<div class="ov" id="forensic">
  <div class="verdicts">
    <div class="verdict core"><span class="k">core</span><span class="v">bubble_dynamics @ 0.67</span></div>
    <div class="verdict eco"><span class="k">eco</span><span class="v">not_established @ 0.25</span></div>
    <div class="verdict final"><span class="k">final</span><span class="v">FALSE</span></div>

  <h4>Conditions met</h4>
  <ul class="conds" id="condList" style="margin:0 0 4px;padding-left:16px;"></ul>
  <h4 style="margin-top:10px;">Honest caveats</h4>
  <ul class="caveats" id="caveatList" style="margin:0;padding-left:16px;"></ul>
</div>

<!-- cascade one-liner (only while a routing filter is active) -->
<div id="cascadeBanner"></div>

<div class="wrap">
  <div id="left">
    <div class="toolbar">
      <button class="tbtn active" data-filter="all">All</button>
      <button class="tbtn" data-filter="core">Core</button>
      <button class="tbtn" data-filter="circular">Circular</button>
      <button class="tbtn" data-filter="downside">Downside</button>

      <button class="tbtn" id="relayoutBtn">Relay</button>
    </div>

    <div id="cywrap">
      <div id="cy"></div>
    </div>
  </div>

  <div id="right">
    <div class="right-head"><div class="ttl" id="rightTtl"></div><span class="x" id="rightClose">✕</span></div>
    <div class="right-body" id="rightBody"></div>
  </div>
</div>

/* ============================================================
   Helpers
   ============================================================ */
function fmtUSD(v){
  if(v === null || v === undefined) return "—";
  if(v >= 1e12) return "$"+(v/1e12).toFixed(2)+"T";
  if(v >= 1e9)  return "$"+(v/1e9).toFixed(2)+"B";
  if(v >= 1e6)  return "$"+(v/1e6).toFixed(1)+"M";
  return "$"+v.toLocaleString();
}
// green(safe 0) -> amber -> red(fragile 1)
function fragColor(f){
  f = Math.max(0, Math.min(1, f));
  let r,g,b;
  if(f < 0.5){ const t=f/0.5; r=Math.round(54+(255-54)*t); g=Math.round(211+(180-211)*t); b=Math.round(153+(84-153)*t); }
  else { const t=(f-0.5)/0.5; r=Math.round(255+(255-255)*t); g=Math.round(180+(90-180)*t); b=Math.round(84+(90-84)*t); }
  return "rgb("+r+","+g+","+b+")";
}
// node size from usd (sqrt scale)
const usdVals = DATA.nodes.map(n=>n.usd||0);
const maxUsd = Math.max.apply(null, usdVals);
function nodeSize(usd){
  const minPx=26, maxPx=92;
  const s = Math.sqrt((usd||0)/maxUsd);
  return Math.round(minPx + (maxPx-minPx)*s);
}

const ISSUERS = new Set(DATA.nodes.filter(n=>n.type==="issuer").map(n=>n.id));

    group:"nodes",

      id:n.id, label:n.label, type:n.type,
      fragility:n.fragility, usd:n.usd, note:n.note||"",
      redteam:n.redteam||"",
      color:fragColor(n.fragility),
      size:nodeSize(n.usd),
      isEnergy: ENERGY.has(n.id)
    }
  });
});
let ei=0;
DATA.edges.forEach(e=>{
  const lbl = (e.usd!==null && e.usd!==undefined) ? fmtUSD(e.usd) : "";

    group:"edges",
    data:{
      id:"e"+(ei++),
      source:e.from, target:e.to,
      etype:e.type, usd:e.usd, tier:e.tier, note:e.note||"",
      label: lbl + (e.tier==="press_reported" ? "  (NON-BINDING)" : ""),
      dashed: e.tier==="press_reported"

});

const CIRCULAR_NODES = new Set();   // NVIDIA loops

  CIRCULAR_NODES.add("NVIDIA");
  DATA.edges.forEach(e=>{
    if(e.from==="NVIDIA" || e.to==="NVIDIA"){
      CIRCULAR_NODES.add(e.from); CIRCULAR_NODES.add(e.to);
    }
  });
})();

const DOWNSIDE_NODES = new Set(["CoreWeave"]);
(function(){
  // lenders + private-credit + end-holders forming the routing path
  const endHolders = DATA.nodes.filter(n=>n.type==="end_holder").map(n=>n.id);
  endHolders.forEach(id=>DOWNSIDE_NODES.add(id));
  DATA.nodes.filter(n=>n.type==="lender").forEach(n=>DOWNSIDE_NODES.add(n.id));
  DATA.edges.forEach(e=>{
    if(["private_credit_funding","policyholder_exposure","syndication"].includes(e.type)){
      DOWNSIDE_NODES.add(e.from); DOWNSIDE_NODES.add(e.to);
    }
  });
})();

const POWER_NODES = new Set(DATA.chokepoints.power);
(function(){
  DATA.edges.forEach(e=>{
    if(e.type==="power_procurement"){ POWER_NODES.add(e.from); POWER_NODES.add(e.to); }
  });
})();

const CORE_NODES = new Set();   // financed core = issuers + their direct counterparties (offtakers, lenders, supplier)
(function(){
  DATA.nodes.forEach(n=>{
    if(["issuer","supplier_investor","fragile_offtaker","durable_offtaker"].includes(n.type))
      CORE_NODES.add(n.id);
  });
})();

function applyFilter(mode){
  let keep = null;
  if(mode==="all") keep = null;
  else if(mode==="core") keep = CORE_NODES;
  else if(mode==="circular") keep = CIRCULAR_NODES;
  else if(mode==="downside") keep = DOWNSIDE_NODES;
  else if(mode==="power") keep = POWER_NODES;

  cy.batch(()=>{
    cy.elements().removeClass("dim");
    if(keep){
      cy.nodes().forEach(n=>{ if(!keep.has(n.id())) n.addClass("dim"); });
      cy.edges().forEach(e=>{
        if(!keep.has(e.source().id()) || !keep.has(e.target().id())) e.addClass("dim");
      });
    }
  });

  // cascade banner is most relevant on downside / circular routing
  const banner = document.getElementById("cascadeBanner");
  if(mode==="downside" || mode==="circular"){
    banner.classList.add("show");
  } else {
    banner.classList.remove("show");
  }
}

    document.querySelectorAll(".tbtn[data-filter]").forEach(b=>b.classList.remove("active"));

});

const typeLabels = DATA.legend.node_types;

function edgesFor(id){
  const out=[], inc=[];
  cy.edges().forEach(e=>{
    if(e.source().id()===id) out.push(e);
    if(e.target().id()===id) inc.push(e);
  });
  return {out, inc};
}

function renderEdgeRow(e, dir){
  const d=e.data();
  const other = dir==="out" ? e.target().data().label : e.source().data().label;
  const arrow = dir==="out" ? "→" : "←";
  const amt = (d.usd!==null && d.usd!==undefined) ? fmtUSD(d.usd) : "—";
  const binding = d.tier==="press_reported" ? ' <span style="color:var(--press);font-weight:700;">NON-BINDING</span>' : '';
  return `<div class="edge-row">
    <div class="edge-dir">${arrow} ${other} <span class="tier ${d.tier}">${d.tier.replace(/_/g,' ')}</span></div>
    <div style="color:var(--muted);margin-top:2px;">${d.etype.replace(/_/g,' ')} · <b style="color:var(--txt);">${amt}</b>${binding}</div>
    ${d.note ? `<div style="color:#aab8c8;margin-top:3px;">${d.note}</div>` : ``}
  </div>`;
}

function showNode(node){
  cy.nodes().removeClass("sel hl");
  cy.edges().removeClass("hl");
  node.addClass("sel");
  node.neighborhood("node").addClass("hl");
  node.connectedEdges().addClass("hl");

  const d = node.data();
  const {out, inc} = edgesFor(d.id);
  const redteam = d.redteam ? `<div class="redteam"><b>Red-team:</b> ${d.redteam}</div>` : ``;
  const choke = d.isEnergy
    ? `<div class="chokeflag"><b>Energy chokepoint</b> (GDS betweenness)</div>`
    : (d.id==="CoreWeave" ? `<div class="chokeflag" style="border-color:#5a4a22;background:#231c10;color:var(--warn);"><b>Financing chokepoint</b></div>` : ``);

  document.getElementById("right").classList.add("show");
  document.getElementById("rightTtl").textContent = d.label;
  document.getElementById("rightBody").innerHTML = `
    <div class="detail-name">${d.label}</div>
    <div class="detail-type">${d.type} — ${typeLabels[d.type]||""}</div>

    <div class="kv">
      <div class="k">$ exposure</div><div class="v">${fmtUSD(d.usd)}</div>
      <div class="k">fragility</div><div class="v">${d.fragility.toFixed(2)}</div>
    </div>
    <div class="frag-bar"><i style="width:${Math.round(d.fragility*100)}%;background:${fragColor(d.fragility)};"></i></div>

    <div class="note"><span class="nlbl">Note</span>${(d.note||"").split(/[.;]/)[0].trim()||"—"}</div>
    ${redteam}
    ${choke}

    <div style="margin-top:16px;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.6px;">
      Outgoing (${out.length})</div>
    ${out.length ? out.map(e=>renderEdgeRow(e,"out")).join("") : '<div class="empty-hint">none</div>'}

    <div style="margin-top:14px;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.6px;">
      Incoming (${inc.length})</div>
    ${inc.length ? inc.map(e=>renderEdgeRow(e,"inc")).join("") : '<div class="empty-hint">none</div>'}
  `;
}
