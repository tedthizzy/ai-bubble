name: refresh-and-deploy

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

on:
  schedule:
    - cron: "7 * * * *" # hourly (GitHub cron is best-effort; minutes of drift are normal)
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: refresh-and-deploy
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Refresh live overlay (keyless public sources)
        run: python3 scripts/refresh_live_overlay.py || echo "overlay refresh failed; keeping previous live.json"

      - name: Commit refreshed overlay
        run: |
          if ! git diff --quiet -- viz/live.json viz/banner.svg; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add viz/live.json viz/banner.svg
            git commit -m "chore: hourly live overlay refresh"
            git push
          fi

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: viz

  deploy:
    needs: refresh
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
