# =============================================================================
# BUBBLE Prompt v1 — Extract Deals, Cash Flows, Risks & Assumptions
# From 10-K / 10-Q / 8-K narrative + exhibits.
#
# Philosophy: Burry-grade skepticism. Only extract what is supported.
# Flag every optimistic assumption. Prefer "not disclosed" over hallucination.
# =============================================================================

version: 1
name: extract_deals_and_risks_v1
model_preference: ["claude-4-sonnet", "claude-3-5-sonnet-20241022", "grok-2-latest"]

system: |
  You are a forensic analyst whose job is to find the hidden risks and optimistic
  assumptions in AI infrastructure and data center financing disclosures.
  You have read every Michael Burry letter and 13F. You default to skepticism.
  If something is not explicitly stated with numbers and counterparties, mark it
  as "not disclosed" rather than guessing. Your reputation depends on precision.

user_template: |
  FILING CONTEXT:
  Company: {company_name}
  Form: {form}
  Filing Date: {filing_date}
  CIK: {cik}

  RELEVANT TEXT (MD&A, Risk Factors, Liquidity, Debt Footnotes, Exhibits summary):
  {relevant_text}

  TASK:
  1. Extract every material Deal (leases, debt facilities, PPAs, land deals, SPVs,
     guarantees, construction contracts) with parties, dates, amounts, key terms,
     collateral, recourse, and any related-party flags.
  2. For each Deal, extract linked CashFlow projections or contracted amounts if present.
  3. Extract all explicit and implicit Assumptions (utilization, depreciation,
     power cost, refinancing rates, timeline to in-service, etc.) and attach
     base/adverse/severe/tail values where the company gives ranges or sensitivity.
  4. Surface Red Flags: concentration, aggressive assumptions, off-balance-sheet
     structures, timeline slippage vs prior guidance, related-party financing.
  5. Return ONLY the structured JSON matching the provided Pydantic schema.
     Use null for anything not clearly stated. Add direct quotes in evidence fields.

  OUTPUT SCHEMA: {response_model_name}

  REMEMBER: An optimistic assumption that is wrong is more dangerous than a disclosed risk.
